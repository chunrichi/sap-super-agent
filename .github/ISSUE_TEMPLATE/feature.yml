name: Feature
description: 功能需求或设计改进
labels: ["type:feature"]
body:
  - type: textarea
    id: background
    attributes: { label: 背景与问题 }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 期望结果 }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: 验收方式, description: 命令、测试或可观察的行为 }
    validations: { required: true }
