name: Bug
description: 可复现的问题
labels: ["type:bug"]
body:
  - type: textarea
    id: steps
    attributes: { label: 复现步骤 }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: 期望与实际 }
    validations: { required: true }
  - type: input
    id: env
    attributes: { label: 环境, description: OS / Node / pnpm / 是否 M1 或 M2 }
    validations: { required: true }
